<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="login-container dynamic-card">
    
    <!-- BANNER ESTILO VANGWEAR (Superior) -->
    <div class="login-banner">
        <div class="banner-overlay">
            <h2>Iniciar Sesión</h2>
            <p>Descubre las últimas tendencias en moda.</p>
        </div>
    </div>


     <div class="login-body">
        <form id="loginForm">
            <div class="input-grupo">
                <label for="username">Usuario o Correo</label>
                <input type="text" id="username" name="username" placeholder="ejemplo@correo.com" required>
            </div>
            
            <div class="input-grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn-login">Ingresar</button>
        </form>
        <p class="footer-form">¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
    </div>

</div>


    <script src="script.js"></script>
</body>
</html>
